<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本地视频播放器</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- ===== 浏览页 ===== -->
<div id="browse-page" class="page">
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" fill="none"><rect x="2" y="4" width="20" height="16" rx="3" fill="#6c5ce7"/><path d="M10 9l6 3-6 3V9z" fill="#fff"/></svg>
      <span>本地视频播放器</span>
    </div>
    <input id="search-box" type="search" placeholder="搜索当前目录…" autocomplete="off">
  </header>

  <div class="content">
    <nav id="breadcrumb" class="breadcrumb"></nav>
    <div class="list-meta" id="list-meta"></div>
    <div id="file-grid" class="file-grid"></div>
    <div id="empty-tip" class="empty-tip hidden">
      <div class="empty-icon">🎬</div>
      <p id="empty-text">这个目录还没有视频文件</p>
    </div>
  </div>
</div>

<!-- ===== 播放页 ===== -->
<div id="player-page" class="page hidden">
  <div class="player-topbar">
    <button id="btn-back" class="btn-back" title="返回 (Esc)">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      返回
    </button>
    <div id="player-title" class="player-title"></div>
    <div class="player-actions">
      <select id="speed-select" class="speed-select" title="播放速度">
        <option value="0.5">0.5x</option>
        <option value="0.75">0.75x</option>
        <option value="1" selected>1x</option>
        <option value="1.25">1.25x</option>
        <option value="1.5">1.5x</option>
        <option value="2">2x</option>
        <option value="3">3x</option>
      </select>
    </div>
  </div>

  <div class="player-wrap">
    <video id="video" controls autoplay playsinline></video>
    <div id="resume-toast" class="resume-toast hidden"></div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
