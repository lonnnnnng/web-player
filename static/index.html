<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1117">
<title>本地音视频播放器</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- ===== 浏览页 ===== -->
<div id="browse-page" class="page">
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" fill="none"><rect x="2" y="4" width="20" height="16" rx="3" fill="#6c5ce7"/><path d="M10 9l6 3-6 3V9z" fill="#fff"/></svg>
      <span>本地音视频播放器</span>
    </div>
    <input id="search-box" type="search" placeholder="搜索全部资源…" aria-label="搜索全部资源" autocomplete="off">
  </header>

  <div class="content">
    <div id="resume-row" class="resume-section hidden">
      <div class="resume-title">▶ 继续观看</div>
      <div id="resume-cards" class="resume-cards"></div>
    </div>
    <nav id="breadcrumb" class="breadcrumb"></nav>
    <div class="list-meta" id="list-meta" aria-live="polite"></div>
    <div id="file-grid" class="file-grid" aria-live="polite"></div>
    <div id="empty-tip" class="empty-tip hidden">
      <div class="empty-icon">🎬</div>
      <p id="empty-text">这个目录还没有音视频文件</p>
    </div>
  </div>
</div>

<!-- ===== 播放页 ===== -->
<div id="player-page" class="page hidden">
  <div class="player-topbar">
    <button id="btn-back" class="btn-back" title="返回 (Esc)">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      返回
    </button>
    <div id="player-title" class="player-title"></div>
    <div class="player-actions">
      <button id="btn-mute" class="btn-back" title="静音/取消静音 (M)">声音 开</button>
      <button id="btn-autonext" class="btn-back" title="播完自动播放同目录下一个">连播 开</button>
      <button id="btn-next" class="btn-back hidden" title="播放下一个 (N)">下一集 ›</button>
      <select id="speed-select" class="speed-select" title="播放速度">
        <option value="0.5">0.5x</option>
        <option value="0.75">0.75x</option>
        <option value="1" selected>1x</option>
        <option value="1.25">1.25x</option>
        <option value="1.5">1.5x</option>
        <option value="2">2x</option>
        <option value="3">3x</option>
      </select>
    </div>
  </div>

  <div class="player-wrap">
    <div id="audio-cover" class="audio-cover hidden">
      <div class="cover-art">
        <svg viewBox="0 0 24 24" fill="none"><path d="M9 18.5a2.5 2.5 0 1 1-2-2.45V6.2a1 1 0 0 1 .76-.97l8.5-2.1A1 1 0 0 1 17.5 4.1v10.95a2.5 2.5 0 1 1-2-2.45V6.53l-6.5 1.6v10.37z" fill="currentColor"/><path d="M9 7.6l8.5-2.1v1.55L9 9.15V7.6z" fill="currentColor" opacity=".55"/></svg>
      </div>
      <div class="cover-meta">
        <div id="audio-title" class="cover-title"></div>
        <div class="cover-sub">正在播放音频</div>
        <div class="eq" id="eq-bars"><span></span><span></span><span></span><span></span><span></span></div>
      </div>
    </div>
    <video id="video" controls autoplay playsinline></video>
    <div id="resume-toast" class="resume-toast hidden"></div>
    <div id="video-error" class="video-error hidden">
      <div class="video-error-title">⚠️ 无法播放</div>
      <div id="video-error-text" class="video-error-text"></div>
    </div>
  </div>
</div>

<script src="/static/utils.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
